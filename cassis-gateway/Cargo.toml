[package]
name = "cassis-gateway"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bitcoin", "cashu", "fedimint", "liquid", "rootstock", "citrea", "solana-wbtc", "starknet-wbtc"]
arkade = ["cassis-networks/arkade", "cassis-wallet/arkade", "hyperb-cassis-wallet/arkade"]
bitcoin = ["cassis-networks/bitcoin", "cassis-wallet/bitcoin", "hyperb-cassis-wallet/bitcoin"]
cashu = ["cassis-networks/cashu", "cassis-wallet/cashu", "hyperb-cassis-wallet/cashu"]
fedimint = ["cassis-networks/fedimint", "cassis-wallet/fedimint", "hyperb-cassis-wallet/fedimint"]
liquid = ["cassis-networks/liquid", "cassis-wallet/liquid", "hyperb-cassis-wallet/liquid"]
rootstock = ["cassis-networks/rootstock", "cassis-wallet/rootstock", "hyperb-cassis-wallet/rootstock"]
citrea = ["cassis-networks/citrea", "cassis-wallet/citrea", "hyperb-cassis-wallet/citrea"]
solana-wbtc = ["cassis-networks/solana-wbtc", "cassis-wallet/solana-wbtc", "hyperb-cassis-wallet/solana-wbtc"]
starknet-wbtc = ["cassis-networks/starknet-wbtc", "cassis-wallet/starknet-wbtc", "hyperb-cassis-wallet/starknet-wbtc"]

[dependencies]
cassis-admin = { workspace = true }
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
cassis-wallet = { workspace = true }
hyperb-cassis-wallet = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hypereffect = { workspace = true }
iroh-base = { workspace = true }
orangedb = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
cassis-preimage-server = { path = "../cassis-preimage-server", default-features = false }
ritualistic = { workspace = true }
