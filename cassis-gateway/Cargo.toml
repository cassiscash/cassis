[package]
name = "cassis-gateway"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bitcoin", "cashu", "fedimint", "liquid", "rootstock"]
arkade = ["cassis-networks/arkade", "cassis-wallet/arkade"]
bitcoin = ["cassis-networks/bitcoin", "cassis-wallet/bitcoin"]
cashu = ["cassis-networks/cashu", "cassis-wallet/cashu"]
fedimint = ["cassis-networks/fedimint", "cassis-wallet/fedimint"]
liquid = ["cassis-networks/liquid", "cassis-wallet/liquid"]
rootstock = ["cassis-networks/rootstock", "cassis-wallet/rootstock"]

[dependencies]
cassis-admin = { workspace = true }
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
cassis-wallet = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hypereffect = { workspace = true }
iroh-base = { workspace = true }
orangedb = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
cassis-preimage-server = { path = "../cassis-preimage-server", default-features = false }
ritualistic = { workspace = true }
