[package]
name = "cassis-playground"
version.workspace = true
edition.workspace = true

[lib]
name = "cassis_playground"
path = "src/lib.rs"

[[bin]]
name = "cassis-playground"
path = "src/main.rs"

[[bin]]
name = "cassis-prefund"
path = "src/bin/prefund.rs"

[dependencies]
cassis-core = { workspace = true, features = ["node"] }
cassis-cashu = { workspace = true }
cassis-arkade = { workspace = true }
cassis-bitcoin = { workspace = true }
cassis-fedimint = { workspace = true }
cassis-liquid = { workspace = true }
cassis-rootstock = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
iroh = { workspace = true }
reqwest = { workspace = true }
ritualistic = { workspace = true }
rustyline = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "process", "time", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
