[package]
name = "cassis-router"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cassis-core = { path = "../cassis-core" }
cassis-iroh = { path = "../cassis-iroh" }
cassis-keys = { path = "../cassis-keys" }
cassis-routing = { path = "../cassis-routing" }
log = "0.4.33"
iroh = "1.0.3"
lowercase-hex = "0.1.1"
ritualistic = "0.1.1"
thiserror = "1.0.69"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dependencies.cassis-cashu]
path = "../networks/cassis-cashu"
optional = true

[dependencies.cassis-arkade]
path = "../networks/cassis-arkade"
optional = true

[dependencies.cassis-rootstock]
path = "../networks/cassis-rootstock"
optional = true

[dependencies.cassis-liquid]
path = "../networks/cassis-liquid"
optional = true

[features]
ark = ["dep:cassis-arkade", "cassis-core/ark"]
cashu = ["dep:cassis-cashu", "cassis-core/cashu"]
liquid = ["dep:cassis-liquid", "cassis-core/liquid"]
rootstock = ["dep:cassis-rootstock", "cassis-core/rootstock"]
