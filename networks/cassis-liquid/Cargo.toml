[package]
name = "cassis-liquid"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
async-trait = { workspace = true }
cassis-core = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
lwk_common = { workspace = true }

# Liquid Wallet Kit (LWK): watch-only wallet over CT descriptors +
# esplora client, plus the software PSET signer. `lwk_wollet`
# re-exports the `elements` crate used for script/tx construction.
lwk_wollet = { workspace = true }
lwk_signer = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
fs2 = { workspace = true }
