[package]
name = "cassis-rootstock"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
async-trait = "0.1.91"
cassis-core = { path = "../../cassis-core" }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.40"
thiserror = "1.0.69"
tokio = { version = "1.46.1", features = ["sync", "time", "rt"] }

alloy = { version = "2.4", default-features = false, features = [
  "std",
  "reqwest",
  "reqwest-rustls-tls",
  "provider-http",
  "rpc-types",
  "signer-local",
  "contract",
  "json-abi",
  "sol-types",
  "network",
  "eips",
  "rlp",
] }