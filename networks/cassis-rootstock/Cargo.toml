[package]
name = "cassis-rootstock"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
async-trait = "0.1.91"
cassis-core = { path = "../../cassis-core" }
# Needed to normalize a secret key to its even-Y form so the x-only
# pubkey -> EVM address mapping is well defined (see `normalize_sk`).
secp256k1 = { version = "0.31", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.40"
sha2 = "0.10"
thiserror = "1.0.69"
tokio = { version = "1.46.1", features = ["sync", "time", "rt"] }
tracing = "0.1.44"

alloy = { version = "2.4", default-features = false, features = [
  "std",
  "reqwest",
  "reqwest-rustls-tls",
  "provider-http",
  "rpc-types",
  "signer-local",
  "contract",
  "json-abi",
  "sol-types",
  "network",
  "eips",
  "rlp",
] }
