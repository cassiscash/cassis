[package]
name = "cassis-arkade"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
cassis-core = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["time"] }

# Arkade Rust SDK (`ark-rs`). `ark-client` is the high-level wallet
# (coin selection, offchain send/claim flows, VTXO listings); it
# re-exports the gRPC transport used to talk to the operator.
ark-client = { workspace = true }
ark-core = { workspace = true }
# Bare operator client, to learn its chain before opening the wallet.
ark-grpc = { workspace = true }
# bdk-backed onchain wallet required by the ark-client type bounds.
ark-bdk-wallet = { workspace = true }
esplora-client = { workspace = true, features = ["async-https"] }

bitcoin = { workspace = true }
rustls = { workspace = true, default-features = false, features = ["ring"] }
