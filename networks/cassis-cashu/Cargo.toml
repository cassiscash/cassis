[package]
name = "cassis-cashu"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
cassis-core = { workspace = true }
# cdk re-exports the full `cashu` type surface (cdk::nuts,
# cdk::Amount, cdk::MintUrl, cdk::dhke, ...) and provides the
# wallet HTTP client (cdk::wallet::HttpClient implementing
# cdk::wallet::MintConnector). `wallet` is enabled so the
# HTTP client is available.
cdk = { workspace = true }
lowercase-hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
