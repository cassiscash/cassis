[package]
name = "cassis-fedimint"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
async-trait = { workspace = true }
cassis-core = { workspace = true }

# Fedimint client stack (LNv2 line). Pin to the same release; adjust the tag
# to match the federation you talk to. `fedimint-connectors` (the iroh
# transport) and the consolidated `gatewayd` land in v0.11; LNv2 itself
# was stabilized earlier (v0.6). Use a single tag across all fedimint
# crates — they share a workspace version.
fedimint-client = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-core = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-rocksdb = { workspace = true }

anyhow = { workspace = true }
bitcoin = { workspace = true }
futures = { workspace = true }
lightning-invoice = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
