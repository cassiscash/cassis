[package]
name = "cassis-cli"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bark-lightning", "bitcoin", "cashu", "fedimint", "lightning", "liquid", "rootstock"]
arkade = ["dep:cassis-arkade"]
bark-lightning = ["dep:cassis-bark-lightning"]
bitcoin = ["dep:cassis-bitcoin"]
cashu = ["dep:cassis-cashu"]
fedimint = ["dep:cassis-fedimint"]
lightning = ["dep:cassis-lnd"]
liquid = ["dep:cassis-liquid"]
rootstock = ["dep:cassis-rootstock"]

[dependencies]
cassis-core = { workspace = true, features = ["node"] }
clap = { workspace = true }
iroh = { workspace = true }
minisqlite = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

cassis-arkade = { workspace = true, optional = true }
cassis-bark-lightning = { workspace = true, optional = true }
cassis-bitcoin = { workspace = true, optional = true }
cassis-cashu = { workspace = true, optional = true }
cassis-fedimint = { workspace = true, optional = true }
cassis-liquid = { workspace = true, optional = true }
cassis-lnd = { workspace = true, optional = true }
cassis-rootstock = { workspace = true, optional = true }
