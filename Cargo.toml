[workspace]
members = [
  "cassis-core",
  "networks/cassis-cashu",
  "networks/cassis-fedimint",
  "networks/cassis-arkade",
  "networks/cassis-bitcoin",
  "networks/cassis-rootstock",
  "networks/cassis-liquid",
  "networks/cassis-lnd",
  "networks/cassis-bark-lightning",
  "cassis-networks",
  "cassis-admin",
  "cassis-routerd",
  "cassis-wallet",
  "cassis-preimage-server",
  "cassis-gateway",
  "cassis-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22.1"
bitcoin = "0.32.102"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
bip39 = "2.2.2"
chacha20 = "0.9.1"
cdk = { version = "0.17.3", features = ["wallet"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.33"
fs2 = "0.4"
hmac = "0.12.1"
hypereffect = "0.6.1"
iroh = "1.0.3"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
lightning-invoice = { version = "0.33.3", features = ["std"] }
lowercase-hex = "0.1.1"
lwk_common = "0.19"
lwk_signer = "0.19"
lwk_wollet = { version = "0.19", default-features = false, features = ["esplora"] }
orangedb = "0.3.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = "0.8.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ritualistic = "0.2.4"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "aws_lc_rs"] }
secp256k1 = { version = "0.31", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "1.0.69"
tokio = "1.53.1"
toml = "0.8.23"
toml_edit = "0.22.27"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

alloy = { version = "2.4", default-features = false, features = [
  "std",
  "reqwest",
  "reqwest-rustls-tls",
  "provider-http",
  "rpc-types",
  "signer-local",
  "contract",
  "json-abi",
  "sol-types",
  "network",
  "eips",
  "rlp",
] }
# `sqlite` persists the SDK contract store (VHTLC rows), so they
# survive restarts; it enables both sqlx and rusqlite upstream.
ark-client = { version = "0.12", default-features = false, features = [
  "sqlite",
  "tls-webpki-roots",
] }
ark-core = "0.12"
ark-grpc = { version = "0.12", default-features = false, features = ["tls-webpki-roots"] }
ark-bdk-wallet = "0.12"
esplora-client = { version = "0.10", features = ["async-https"] }

# PR #8913 (direct_htlc branch): raw HTLC/PTLC client API on LNv2
# OutgoingContract — the surface the fedimint adapter's
# NetworkAdapter implementation is built on. Head commit of the
# PR as of Sep 2026; swap to a tag once it lands on master.
fedimint-client = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-api-client = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-client-module = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-core = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-connectors = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-derive-secret = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-eventlog = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-mintv2-client = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-lnv2-client = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-walletv2-client = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }
fedimint-rocksdb = { git = "https://github.com/fedimint/fedimint", rev = "cf55fd9cdc61412bc079c8d00208e7fcc07a3948" }

cassis-core = { path = "cassis-core", default-features = false }
cassis-admin = { path = "cassis-admin" }
cassis-wallet = { path = "cassis-wallet", default-features = false }
cassis-networks = { path = "cassis-networks" }
cassis-cashu = { path = "networks/cassis-cashu" }
cassis-fedimint = { path = "networks/cassis-fedimint" }
cassis-arkade = { path = "networks/cassis-arkade" }
cassis-bitcoin = { path = "networks/cassis-bitcoin" }
cassis-rootstock = { path = "networks/cassis-rootstock" }
cassis-liquid = { path = "networks/cassis-liquid" }
cassis-lnd = { path = "networks/cassis-lnd" }
cassis-bark-lightning = { path = "networks/cassis-bark-lightning" }

# Bark with hash-only lightning receives (preimage given later), from
# our fork of https://gitlab.com/ark-bitcoin/bark.
bark-wallet = { git = "https://github.com/cassiscash/bark-hold-preimage", rev = "7d735a7382c15c1e530c6d85ebe0f96519843332", default-features = false, features = ["sqlite", "native", "rand", "tls-webpki-roots"] }
bark-bitcoin-ext = { git = "https://github.com/cassiscash/bark-hold-preimage", rev = "7d735a7382c15c1e530c6d85ebe0f96519843332" }
