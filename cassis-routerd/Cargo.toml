[package]
name = "cassis-routerd"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bark-lightning", "bitcoin", "cashu", "fedimint", "lightning", "liquid", "rootstock"]
arkade = ["cassis-networks/arkade"]
bark-lightning = ["cassis-networks/bark-lightning"]
bitcoin = ["cassis-networks/bitcoin"]
cashu = ["cassis-networks/cashu"]
fedimint = ["cassis-networks/fedimint"]
lightning = ["cassis-networks/lightning"]
liquid = ["cassis-networks/liquid"]
rootstock = ["cassis-networks/rootstock"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
hypereffect = { workspace = true }
iroh = { workspace = true }
lowercase-hex = { workspace = true }
rand = { workspace = true }
ritualistic = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
