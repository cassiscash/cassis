[package]
name = "cassis-routerd"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bark-lightning", "bitcoin", "cashu", "fedimint", "lightning", "liquid", "rootstock"]
arkade = ["cassis-networks/arkade", "cassis-wallet/arkade"]
bark-lightning = ["cassis-networks/bark-lightning", "cassis-wallet/bark-lightning"]
bitcoin = ["cassis-networks/bitcoin", "cassis-wallet/bitcoin"]
cashu = ["cassis-networks/cashu", "cassis-wallet/cashu"]
fedimint = ["cassis-networks/fedimint", "cassis-wallet/fedimint"]
lightning = ["cassis-networks/lightning", "cassis-wallet/lightning"]
liquid = ["cassis-networks/liquid", "cassis-wallet/liquid"]
rootstock = ["cassis-networks/rootstock", "cassis-wallet/rootstock"]

[dependencies]
cassis-admin = { workspace = true }
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
cassis-wallet = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
hypereffect = { workspace = true }
lowercase-hex = { workspace = true }
orangedb = { workspace = true }
ritualistic = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
