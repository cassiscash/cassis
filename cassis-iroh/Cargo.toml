[package]
name = "cassis-iroh"
version.workspace = true
edition.workspace = true

[dependencies]
cassis-core = { path = "../cassis-core" }
iroh = "0.35"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["io-util", "sync"] }
