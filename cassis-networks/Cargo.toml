[package]
name = "cassis-networks"
version.workspace = true
edition.workspace = true

# Opens the network adapters compiled in, one cargo feature per network,
# for the binaries that run Cassis nodes (cassis-wallet, cassis-routerd).
[features]
arkade = ["dep:cassis-arkade"]
bark-lightning = ["dep:cassis-bark-lightning"]
bitcoin = ["dep:cassis-bitcoin"]
cashu = ["dep:cassis-cashu"]
citrea = ["dep:cassis-citrea"]
fedimint = ["dep:cassis-fedimint"]
lightning = ["dep:cassis-lnd"]
liquid = ["dep:cassis-liquid"]
rootstock = ["dep:cassis-rootstock"]
solana-wbtc = ["dep:cassis-solana-wbtc"]
spark-lightning = ["dep:cassis-spark-lightning"]
starknet-wbtc = ["dep:cassis-starknet-wbtc"]

[dependencies]
cassis-core = { workspace = true }
tracing = { workspace = true }

cassis-arkade = { workspace = true, optional = true }
cassis-bark-lightning = { workspace = true, optional = true }
cassis-bitcoin = { workspace = true, optional = true }
cassis-cashu = { workspace = true, optional = true }
cassis-citrea = { workspace = true, optional = true }
cassis-fedimint = { workspace = true, optional = true }
cassis-liquid = { workspace = true, optional = true }
cassis-lnd = { workspace = true, optional = true }
cassis-rootstock = { workspace = true, optional = true }
cassis-solana-wbtc = { workspace = true, optional = true }
cassis-spark-lightning = { workspace = true, optional = true }
cassis-starknet-wbtc = { workspace = true, optional = true }
