[package]
name = "cassis-core"
version.workspace = true
edition.workspace = true

[features]
default = ["node"]
# The iroh transport nodes talk over. Network crates and wasm builds go
# without.
node = ["dep:futures", "dep:iroh", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bip32 = { workspace = true }
bip39 = { workspace = true }
chacha20 = { workspace = true }
hmac = { workspace = true }
# Ed25519 keys of iroh endpoints, which sign invoices. Not optional:
# invoices are checked without the node runtime too (wasm).
iroh-base = { workspace = true }
lowercase-hex = { workspace = true, features = ["alloc"] }
postcard = { workspace = true }
rand = { workspace = true }
ritualistic = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio_with_wasm = { version = "0.8", features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

futures = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
