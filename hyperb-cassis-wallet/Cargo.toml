[package]
name = "hyperb-cassis-wallet"
version.workspace = true
edition.workspace = true
description = "A hyperb interface to manage Cassis wallets: add networks to a config file, see their funds, deposit and withdraw"

# One feature per network the Cassis wallets can be on, as in `cassis-wallet`:
# turn on the ones the host binary should offer.
[features]
default = []
arkade = ["cassis-networks/arkade"]
bark-lightning = ["cassis-networks/bark-lightning"]
bitcoin = ["cassis-networks/bitcoin"]
cashu = ["cassis-networks/cashu"]
fedimint = ["cassis-networks/fedimint"]
lightning = ["cassis-networks/lightning"]
liquid = ["cassis-networks/liquid"]
rootstock = ["cassis-networks/rootstock"]
all = ["arkade", "bark-lightning", "bitcoin", "cashu", "fedimint", "lightning", "liquid", "rootstock"]

[dependencies]
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
hypereffect = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
