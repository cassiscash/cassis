[package]
name = "cassis-preimage-server"
version.workspace = true
edition.workspace = true

[features]
default = ["arkade", "bitcoin", "cashu", "fedimint", "liquid", "rootstock"]
arkade = ["cassis-networks/arkade"]
bitcoin = ["cassis-networks/bitcoin"]
cashu = ["cassis-networks/cashu"]
fedimint = ["cassis-networks/fedimint"]
liquid = ["cassis-networks/liquid"]
rootstock = ["cassis-networks/rootstock"]

[dependencies]
cassis-admin = { workspace = true }
cassis-core = { workspace = true, features = ["node"] }
cassis-networks = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
futures = { workspace = true }
hypereffect = { workspace = true }
iroh = { workspace = true }
iroh-base = { workspace = true }
orangedb = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
