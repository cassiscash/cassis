[package]
name = "cassis-client"
version.workspace = true
edition.workspace = true

[features]
default = []
cashu = ["cassis-core/cashu"]
rootstock = ["cassis-core/rootstock"]

[dependencies]
cassis-core = { path = "../cassis-core", features = ["cashu", "rootstock"] }
cassis-keys = { path = "../cassis-keys" }
cassis-routing = { path = "../cassis-routing" }
cassis-iroh = { path = "../cassis-iroh" }
cassis-router = { path = "../cassis-router" }
cassis-cashu = { path = "../networks/cassis-cashu" }
cassis-rootstock = { path = "../networks/cassis-rootstock" }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.33"
iroh = "1.0.3"
log = "0.4.33"
rand = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "1.0.69"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "fs", "io-util", "net"] }
minisqlite = { git = "https://github.com/cursor/minisqlite" }
